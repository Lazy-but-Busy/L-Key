<!-- @dsCard group="Admin Portal" viewport="1280x800" name="L Key admin portal" subtitle="Dashboard → Song database, with delete confirmation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>L Key — Admin Portal</title><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0;background:var(--lk-canvas)}#root{min-height:100vh}</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="SongDatabaseScreen.jsx"></script>
<script type="text/babel" src="ContentScreens.jsx"></script>
<script type="text/babel" src="PeopleScreens.jsx"></script>
<script type="text/babel" src="BusinessScreens.jsx"></script>
<script type="text/babel">
const { AdminSidebar, AppButton, ConfirmDialog } = window.LKeyDesignSystem_355d7c;
const Dashboard = window.LKAdminDashboard, SongDb = window.LKAdminSongDatabase, AdmIcon = window.LKAdminIcon;
const SongEditor = window.LKAdminSongEditor, Chords = window.LKAdminChords, Users = window.LKAdminUsers, Payments = window.LKAdminPayments, Plans = window.LKAdminPlans, Analytics = window.LKAdminAnalytics;

const NAV = [
  { label: "Dashboard", icon: <AdmIcon name="dashboard" w={18} h={18} /> },
  { label: "Songs", icon: <AdmIcon name="library-music" w={18} h={18} /> },
  { label: "Chords", icon: <AdmIcon name="stack-pin" w={18} h={18} /> },
  { label: "Users", icon: <AdmIcon name="users" w={18} h={13} /> },
  { label: "Payments", icon: <AdmIcon name="history-clock" w={18} h={18} /> },
  { label: "Premium Plans", icon: <AdmIcon name="add-circle" w={16} h={16} /> },
  { label: "Analytics", icon: <AdmIcon name="more-horizontal" w={16} h={4} /> },
];

function App() {
  const [nav, setNav] = React.useState(0);
  const [pending, setPending] = React.useState(null);
  const [editing, setEditing] = React.useState(null); // song being edited
  const pick = (i) => { setEditing(null); setNav(i); window.scrollTo(0, 0); };
  return (
    <div style={{display:"flex",alignItems:"stretch",minHeight:"100vh",background:"var(--lk-canvas)"}}>
      <AdminSidebar
        user={{ name: "Admin User", role: "Super Admin", avatar: "../../assets/images/admin-avatar.jpg" }}
        items={NAV} activeIndex={nav} onSelect={pick}
        footer={<AppButton variant="primary" size="md" block style={{boxShadow:"var(--lk-ring),var(--lk-shadow-accent)"}} icon={<svg width="18" height="18" viewBox="0 0 18 18" fill="#fff"><path d="M 2 18 C 1.45 18 0.979 17.804 0.587 17.413 C 0.196 17.021 0 16.55 0 16 L 0 2 C 0 1.45 0.196 0.979 0.587 0.587 C 0.979 0.196 1.45 0 2 0 L 9 0 L 9 2 L 2 2 L 2 16 L 9 16 L 9 18 L 2 18 M 13 14 L 11.625 12.55 L 14.175 10 L 6 10 L 6 8 L 14.175 8 L 11.625 5.45 L 13 4 L 18 9 L 13 14 Z"/></svg>}>System Logout</AppButton>} />
      <main style={{flexGrow:1,padding:32,boxSizing:"border-box",overflow:"hidden"}}>
        <div style={{maxWidth:1280}}>
          {nav === 0 ? <Dashboard /> : null}
          {nav === 1 ? (editing ? <SongEditor song={editing} onBack={() => setEditing(null)} /> : <SongDb onDelete={setPending} onEdit={setEditing} />) : null}
          {nav === 2 ? <Chords /> : null}
          {nav === 3 ? <Users /> : null}
          {nav === 4 ? <Payments /> : null}
          {nav === 5 ? <Plans /> : null}
          {nav === 6 ? <Analytics /> : null}
        </div>
      </main>
      {pending ? (
        <div style={{position:"fixed",inset:0,zIndex:10}}>
          <ConfirmDialog open title="Delete song?" body={"“" + pending.title + "” and its chord content will be removed from the library."}
            confirmLabel="Delete" onConfirm={() => setPending(null)} onCancel={() => setPending(null)} style={{height:"100%"}} />
        </div>
      ) : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
