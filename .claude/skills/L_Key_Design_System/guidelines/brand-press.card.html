<!-- @dsCard group="Brand" viewport="700x150" name="Press behaviour" subtitle="Translate 3px toward the shadow, drop it to 1px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--lk-paper);font-family:var(--lk-font-body);box-sizing:border-box}.r{display:flex;gap:32px;align-items:center}.btn{min-height:52px;padding:12px 24px;background:#000;color:#fff;font-family:var(--lk-font-display);font-weight:600;font-size:18px;line-height:28px;text-transform:uppercase;display:inline-flex;align-items:center}.c{font-family:var(--lk-font-mono);font-size:10px;color:var(--lk-grey-500);margin-top:12px;text-transform:uppercase}</style></head><body>
<div class="r">
<div><div class="btn" style="box-shadow:var(--lk-shadow)">Resume</div><div class="c">rest · 4px 4px 0</div></div>
<div><div class="btn" style="box-shadow:var(--lk-shadow-pressed);transform:translate(3px,3px)">Resume</div><div class="c">pressed · 1px 1px 0 · +3px</div></div>
<div><div class="btn" style="box-shadow:var(--lk-shadow);opacity:.4">Resume</div><div class="c">disabled · 40%</div></div>
</div></body></html>
