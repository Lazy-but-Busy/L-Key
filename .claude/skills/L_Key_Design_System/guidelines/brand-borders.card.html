<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--lk-paper);font-family:var(--lk-font-body);box-sizing:border-box}.r{display:flex;gap:24px;align-items:flex-start}.b{width:110px;height:60px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--lk-font-mono);font-size:11px}.c{font-family:var(--lk-font-mono);font-size:10px;color:var(--lk-grey-500);margin-top:10px;text-transform:uppercase}</style></head><body>
<div class="r">
<div><div class="b" style="box-shadow:var(--lk-ring-hairline)">1px</div><div class="c">hairline grid</div></div>
<div><div class="b" style="box-shadow:var(--lk-ring)">2px</div><div class="c">primary border</div></div>
<div><div class="b" style="box-shadow:inset 0 0 0 3px #000">3px</div><div class="c">important control</div></div>
<div><div class="b" style="box-shadow:var(--lk-ring);border-radius:4px">4px</div><div class="c">radius allowed</div></div>
<div><div class="b" style="box-shadow:var(--lk-ring);border-radius:9999px">pill</div><div class="c">play / avatar only</div></div>
