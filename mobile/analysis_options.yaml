# L Key Flutter analysis options.
#
# very_good_analysis is stricter than flutter_lints and enforces several rules
# this project relies on: public API documentation, no print, immutability
# hints, and sorted imports.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated by `flutter gen-l10n` and reproducible from the ARB files.
    - lib/app/localization/generated/**
    # NOTE: lib/app/theme/tokens.g.dart is deliberately NOT excluded.
    # Excluding it hid a real compile error (a missing import) that only
    # surfaced when the tests tried to build. Generated code is still code.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # A missing translation must fail the build, not warn.
    missing_required_param: error
    missing_return: error
    # Treat TODOs as informational rather than warnings so CI stays clean
    # while Phase 02 work is explicitly marked.
    todo: info

linter:
  rules:
    # The design system is the source of visual values; a literal colour in a
    # widget is exactly what DESIGN.md §66 forbids.
    - avoid_redundant_argument_values
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
